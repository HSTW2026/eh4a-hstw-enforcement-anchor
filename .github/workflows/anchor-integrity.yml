name: Anchor Integrity

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  anchor-integrity:
    name: anchor-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate anchors and append-only history
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: python3 tools/check_anchor_repo.py

      - name: Run guard regression tests
        run: python3 tools/test_anchor_guard.py

      - name: Run honesty-control tests
        run: python3 tests/test_honesty_control.py

      - name: Run honesty-policy integrity test
        run: python3 tests/test_honesty_policy_integrity.py

      - name: Run honesty-gate tests
        run: python3 tests/test_honesty_gate.py

      - name: Enforce honesty claims for consequential changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_BEFORE: ${{ github.event.before }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              test -n "$GITHUB_BASE_REF"
              git fetch --no-tags origin "$GITHUB_BASE_REF"
              BASE_REF="origin/$GITHUB_BASE_REF"
              ;;
            push)
              test -n "$GITHUB_BEFORE"
              test "$GITHUB_BEFORE" != "0000000000000000000000000000000000000000"
              BASE_REF="$GITHUB_BEFORE"
              ;;
            workflow_dispatch)
              git rev-parse HEAD^ >/dev/null
              BASE_REF="HEAD^"
              ;;
            *)
              echo "DELIVERY_BLOCKED_HONESTY_GATE: unsupported event $GITHUB_EVENT_NAME"
              exit 1
              ;;
          esac
          python3 tools/check_honesty_gate.py --base-ref "$BASE_REF"
